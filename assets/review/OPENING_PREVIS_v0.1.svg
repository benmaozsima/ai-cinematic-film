    <text x="365" y="258" class="head" fill="#2d2923">DIALOGUE</text>
    <text x="365" y="298" class="dialogue" fill="#6f4c38">“Shoko isn’t answering.</text><text x="365" y="330" class="dialogue" fill="#6f4c38">I’ll go check.”</text>
    <text x="365" y="372" class="head" fill="#2d2923">SOUND</text><text x="365" y="406" class="body" fill="#554e43">Phone buzz stops · cane lifted</text>
